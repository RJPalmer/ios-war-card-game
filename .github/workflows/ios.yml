name: iOS CI (Build · Lint · Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode schemes
        run: xcodebuild -list -project "War Card Game/War Card Game.xcodeproj"
      
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: 'latest-stable'

      - name: Build app
        run: |
          DEVICE=$(xcrun simctl list devices available \
          | grep -E "iPhone|iPad" \
          | grep -v "unavailable" \
          | head -1 \
          | awk '{$1=$1;print}')

            xcodebuild \
                    -project "War Card Game/War Card Game.xcodeproj" \
                    -scheme "War Card Game" \
                    -destination "platform=iOS Simulator,name=$DEVICE" \
            clean build
            -scheme ios-war-card-game \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            clean build
