name: iOS CI (Build · Lint · Test)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
            xcode-version: 'latest-stable'

      - name: Build app
        run: |
          DEVICE=$(xcrun xctrace list devices 2>&1 \
            | grep -oE 'iPhone.*?[^\(]+' \
            | head -1 \
            | sed 's/ Simulator$//')

          xcodebuild \
            -project ios-war-card-game.xcodeproj \
            -scheme ios-war-card-game \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            clean build
